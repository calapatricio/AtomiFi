name: scaffold

on:
  push:
    branches: [scaffold-app]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: >
          flutter create --org io.github.calapatricio --project-name atomifi
          --platforms android,web app
      - run: flutter test
        working-directory: app
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Scaffold the Flutter app with flutter create"
          git push
