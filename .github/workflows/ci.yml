name: ci

on:
  push:
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/domain
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Check formatting
        run: dart format . && git diff --exit-code
      - run: dart analyze
      - run: dart test

  cashew:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cashew
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Check formatting
        run: dart format . && git diff --exit-code
      - run: dart analyze
      - run: dart test

  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/data
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
      - name: Check formatting
        run: dart format . && git diff --exit-code
      - run: dart run build_runner build
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check formatting
        run: dart format . && git diff --exit-code
      - run: flutter analyze
      - run: flutter test
