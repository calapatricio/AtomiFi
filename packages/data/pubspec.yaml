name: atomifi_data
description: SQLite storage for AtomiFi, built on Drift. Pure Dart, no Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  atomifi_domain:
    path: ../domain
  drift: ^2.20.0
  sqlite3: ^2.4.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  lints: ^5.0.0
  test: ^1.25.0
